name: Run Modified Notebooks

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  run_modified_notebooks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up latest Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r scripts/script_reqs.txt
        python -m pip install -r requirements.txt
      env:
        PIP_INDEX_URL: ${{ secrets.PYPI_URL }}
          
    - name: 
      run: python -m scripts.run_notebook