name: Run Modified Notebooks

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  run_modified_notebooks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up latest Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install dependencies
      # Skip if the pull request was an auto-generated create HTML PR
      if: contains(github.event.pull_request.title, 'Creating HTML files for new notebooks') == false
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r scripts/script_reqs.txt
        python -m pip install -r requirements.txt
    - name: Install enterprise dependencies
      run: |
        sdv-installer install --license-key ${{ secrets.LICENSE_KEY }} --username ${{ secrets.DATACEBO_USERNAME }}
        
    - name: Install Google Chrome for Plotly image export
      if: contains(github.event.pull_request.title, 'Creating HTML files for new notebooks') == false
      run: plotly_get_chrome -y 
          
    - name: Run modified notebooks
      if: contains(github.event.pull_request.title, 'Creating HTML files for new notebooks') == false
      run: python -m scripts.run_notebook
