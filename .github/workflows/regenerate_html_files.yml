name: Regenerate HTML files
on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up latest Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/script_reqs.txt
          python -m pip install -r requirements.txt
      - name: Install enterprise dependencies
        run: |
          sdv-installer install --license-key ${{ secrets.LICENSE_KEY }} --username ${{ secrets.DATACEBO_USERNAME }}
      - name: Install Google Chrome for Plotly image export
        run: plotly_get_chrome -y
      - name: Build HTML from notebooks
        run: python -m scripts.create_notebook_html --all
      - name: Package HTML into docs directory
        run: |
          mkdir -p docs
          find docs -mindepth 1 ! -name CNAME -delete
          find . -name "*.html" -not -path "./docs/*" -print0 |
          while IFS= read -r -d '' f; do
            rel=${f#./}
            dest="docs/${rel#*/}"
            mkdir -p "$(dirname "$dest")"
            cp "$f" "$dest"
          done
      - name: Check for changes
        id: git_diff
        run: |
          git add -N docs || true
          if git diff --quiet -- docs/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      - name: Create PR
        if: steps.git_diff.outputs.changed == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: "docs/*.html"
          commit-message: Recreating HTML files for notebooks
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: ${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>
          signoff: false
          delete-branch: true
          base: main
          branch: recreate_notebook_html_${{ github.run_id }}
          title: "Recreating HTML files for notebooks"
          token: ${{ secrets.DATACEBO_GH_TOKEN }}
      - name: Enable Pull Request Automerge
        if: steps.git_diff.outputs.changed == 'true'
        run: gh pr merge --squash --auto recreate_notebook_html_${{ github.run_id }}
        env:
          GH_TOKEN: ${{ secrets.DATACEBO_GH_TOKEN }}
