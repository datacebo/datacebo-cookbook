name: Run Notebooks

on:
  workflow_dispatch:
    inputs:
      notebook_path:
        description: 'Filepath to the notebook relative to the datacebo-cookbook directory.'
        required: true
        type: string

jobs:
  run_notebooks:
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      SNOWFLAKE_USERNAME: ${{ secrests.SNOWFLAKE_USERNAME }}
      SNOWFLAKE_ACCOUNT_IDENTIFIER: ${{ secrets.SNOWFLAKE_ACCOUNT_IDENTIFIER }}
      SNOWFLAKE_WAREHOUSE: ${{ secrests.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE: ${{ secrests.SNOWFLAKE_ROLE }}
      SNOWFLAKE_RSA_PASSWORD: ${{ secrests.SNOWFLAKE_RSA_PASSWORD }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Set up latest Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r scripts/script_reqs.txt
        python -m pip install -r requirements.txt
    - name: Install enterprise dependencies
      run: |
        sdv-installer install --license-key ${{ secrets.LICENSE_KEY }} --username ${{ secrets.DATACEBO_USERNAME }}
    - name: Install AI-Connectors
      run: |
        sdv-installer install --package bundle-ai-connectors --options db-snowflake --license-key ${{ secrets.LICENSE_KEY }} --username ${{ secrets.DATACEBO_USERNAME }}

    - name: Configure Snowflake RSA authentication
      shell: bash
      run: |
        mkdir -p "$HOME/.snowflake/keys"
        chmod 700 "$HOME/.snowflake/keys"

        printf '%s\n' "$SNOWFLAKE_PRIVATE_KEY" \
          > "$HOME/.snowflake/keys/rsa_key.p8"

        chmod 600 "$HOME/.snowflake/keys/rsa_key.p8"

    - name: Install Google Chrome for Plotly image export
      run: plotly_get_chrome -y

    - name:
      run: python -m scripts.run_notebook -n ${{ inputs.notebook_path }}
